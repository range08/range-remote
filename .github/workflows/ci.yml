name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: ./scripts/oauth-e2e-smoke.sh
      - run: npm audit --omit=dev --audit-level=high
      - run: cp .env.example .env && docker compose config -q && rm .env
      - run: docker build -f apps/server/Dockerfile .
      - run: docker build -f apps/auth/Dockerfile .
      - run: docker build -f apps/gateway/Dockerfile .
