services:
  auth:
    container_name: range-remote-auth
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8790"
    volumes:
      - range_remote_auth_data:/app/data
    ports:
      - "127.0.0.1:8790:8790"
    networks:
      - cloudflare
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  server:
    container_name: range-remote
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8787"
    volumes:
      - range_remote_data:/app/data
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - cloudflare
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  gateway:
    container_name: range-remote-gateway
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    networks:
      - cloudflare
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Host: remotemcp.range08.shop", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  range_remote_data:
  range_remote_auth_data:

networks:
  cloudflare:
    external: true
